name: Generate Short (Kaggle Auto TTS)

on:
  workflow_dispatch:
    inputs:
      script_file:
        description: 'Script file path'
        required: false
        default: 'config/scripts/EPISODE_01.txt'
  push:
    paths:
      - 'config/scripts/**'
      - '!.github/workflows/**'

jobs:
  # De-dup: the frontend commits AUTO_* scripts AND dispatches this workflow,
  # so the push event for AUTO_* files must not also run the job (that used to
  # start TWO identical Actions per video). Manual EPISODE_* pushes still run.
  create-short-kaggle:
    if: >-
      github.event_name != 'push' ||
      !contains(join(github.event.commits.*.message, ' '), 'Auto script for')
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: UTC
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ffmpeg \
            imagemagick \
            fonts-dejavu-core \
            fonts-noto \
            fonts-roboto \
            fonts-open-sans \
            fonts-montserrat \
            fonts-cantarell

      - name: Fix ImageMagick security policy
        run: |
          sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' /etc/ImageMagick-6/policy.xml
          sudo sed -i 's/<policy domain="coder" rights="none" pattern="PDF"/<policy domain="coder" rights="read|write" pattern="PDF"/' /etc/ImageMagick-6/policy.xml

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install kaggle edge-tts requests

      - name: Create directories
        run: mkdir -p audio output

      - name: TTS on Kaggle (auto start/stop, CPU fallback on GPU quota)
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KERNEL_SLUG: satwiksamanta/peter-tts-auto
          KERNEL_DIR: kaggle/tts-kernel
          SCRIPT_FILE: ${{ github.event.inputs.script_file || 'config/scripts/EPISODE_01.txt' }}
          POLL_TIMEOUT_MIN: '75'
        run: |
          if [ -z "$SCRIPT_FILE" ]; then SCRIPT_FILE='config/scripts/EPISODE_01.txt'; fi
          kaggle_rc=0
          python scripts/kaggle_run.py || kaggle_rc=$?
          if [ "$kaggle_rc" -ne 0 ] || ! ls audio/*.wav >/dev/null 2>&1; then
            echo "Kaggle TTS unavailable, using CPU fallback"
            python scripts/tts_cpu.py "$SCRIPT_FILE"
          fi

      - name: Verify audio files
        run: |
          echo "Audio files generated:"
          ls -lh audio/ || echo "No audio directory"
          echo ""
          echo "Total WAV files: $(ls audio/*.wav 2>/dev/null | wc -l)"
          echo ""
          echo "Metadata:"
          cat audio/metadata.json | python3 -m json.tool || echo "No metadata"
          echo ""
          if ! ls audio/*.wav >/dev/null 2>&1; then
            echo "FATAL: no audio wavs, cannot assemble video"; exit 1
          fi

      - name: Assemble Video
        env:
          SCRIPT_PATH: ${{ github.event.inputs.script_file || 'config/scripts/EPISODE_01.txt' }}
          PYTHONUNBUFFERED: '1'
        run: python -u scripts/assemble_video.py

      - name: Add Captions
        env:
          PYTHONUNBUFFERED: '1'
        run: python -u scripts/add_captions.py

      - name: Verify final output
        run: |
          echo "Final video:"
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 output/final_reel.mp4
          ffprobe -v error -show_entries stream=width,height -of default=noprint_wrappers=1 output/final_reel.mp4
          ls -lh output/

      - name: Publish temp link + notify frontend
        # Always attempts the temp link when final_reel.mp4 exists (even if the
        # artifact-upload tail failed), so the user still gets the video.
        if: success() || failure()
        continue-on-error: true
        env:
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          SCRIPT_PATH: ${{ github.event.inputs.script_file || 'config/scripts/EPISODE_01.txt' }}
        run: |
          [ -f output/final_reel.mp4 ] || { echo "no video, skipping publish"; exit 0; }
          JOB_ID=$(grep -m1 '^# JOB:' "$SCRIPT_PATH" | cut -d: -f2 | tr -d ' \r\n' || true)
          if [ -z "$JOB_ID" ] || [ -z "$CALLBACK_URL" ]; then
            echo "No frontend job (manual run) â€” skipping callback."
            exit 0
          fi
          SIZE=$(stat -c%s output/final_reel.mp4)
          echo "Uploading $SIZE bytes for job $JOB_ID"
          URL=$(python scripts/upload_temp.py output/final_reel.mp4 | tail -n 1)
          echo "temp url: $URL"
          case "$URL" in
            http*) ;;
            *) echo "FATAL: temp upload failed"; exit 1 ;;
          esac
          curl -s -X POST "$CALLBACK_URL" -H 'Content-Type: application/json' \
            -d "{\"job_id\":\"$JOB_ID\",\"secret\":\"$CALLBACK_SECRET\",\"temp_url\":\"$URL\",\"status\":\"done\"}"
          echo "Frontend notified: $URL"

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: family-guy-short-${{ github.run_number }}
          path: output/final_reel.mp4
          retention-days: 30

      - name: Upload audio files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-files-${{ github.run_number }}
          path: |
            audio/peter_*.wav
            audio/stewie_*.wav
            audio/metadata.json
          if-no-files-found: error
          retention-days: 30
