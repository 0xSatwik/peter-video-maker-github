<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Peter Video Maker</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="wrap">
  <h1>Peter Video Maker</h1>

  <section id="gate" class="card">
    <h2>Access key</h2>
    <input id="key" type="password" placeholder="Enter access key" autocomplete="off" />
    <input id="agentUrl" type="text" placeholder="Agent URL (e.g. https://peter-agent.onrender.com)" autocomplete="off" />
    <button id="unlock">Unlock</button>
    <p id="gateMsg" class="msg"></p>
  </section>

  <section id="app" class="card hidden">
    <h2>New video</h2>
    <input id="topic" type="text" placeholder="Topic, e.g. Peter discovers protein shakes" />
    <div class="row">
      <label>Length <input id="maxtokens" type="number" value="600" min="200" max="2000" step="50" /></label>
      <button id="draft">Draft script (agent)</button>
    </div>
    <p class="hint">The agent researches the live web with Gemini, then drafts the script. You can edit it before generating.</p>
  </section>

  <section id="draftCard" class="card hidden">
    <h2>Draft script <span id="draftState"></span></h2>
<textarea id="scriptBox" rows="14" spellcheck="false"></textarea>

    <div class="row">
      <input id="instruction" type="text" placeholder="Change something... e.g. make Stewie more savage" />
      <button id="revise">Revise</button>
    </div>
    <div class="row">
      <button id="approve">Approve &amp; generate video</button>
      <button id="back" class="ghost">Back</button>
    </div>
    <p class="hint">Edit lines freely (format: peter|tags|text). Revise sends your edit instruction to the agent.</p>
  </section>

  <section id="job" class="card hidden">
    <h2>Job <span id="jobId"></span></h2>
    <div class="bar"><div id="barFill"></div></div>
    <p id="stage">queued</p>
    <p>Elapsed: <span id="elapsed">0:00</span></p>
    <pre id="script"></pre>
    <a id="dl" class="hidden" href="#" target="_blank" rel="noopener"><button>Download video (temp link, 24h)</button></a>
    <p><button id="reset" class="ghost">Start new</button></p>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>
